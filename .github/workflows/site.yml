name: Site

# Deploys the site on every push (the morning data refresh) and, on game nights,
# every 10 minutes with fresh live scores from NHL.com.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 10 min, 21:00-06:59 UTC (about 5 PM to 3 AM Toronto)
    - cron: "*/10 21-23 * * *"
    - cron: "*/10 0-6 * * *"
    # Weekend matinees, 16:00-20:59 UTC (about noon to 5 PM Toronto)
    - cron: "*/10 16-20 * * 0,6"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Live scores
        id: live
        run: python scripts/live.py
      - name: Skip when no games have started
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.live.outputs.active }}" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.go == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.go == 'true'
        with:
          path: .
      - id: deployment
        if: steps.gate.outputs.go == 'true'
        uses: actions/deploy-pages@v4
